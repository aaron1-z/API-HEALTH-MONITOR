<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Health Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
        }
        h1 { margin-bottom: 2rem; }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
        .url { font-size: 0.875rem; color: #94a3b8; font-family: monospace; }
        .status {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .status.UP { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status.DOWN { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .status.UNKNOWN { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
        
        .metrics {
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            font-size: 0.875rem;
        }
        .metric { display: flex; flex-direction: column; }
        .label { color: #94a3b8; font-size: 0.75rem; }
        .value { margin-top: 2px; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>API System Status</h1>
            <a href="/docs" style="color: #60a5fa; text-decoration: none;">API Docs &rarr;</a>
        </div>
        
        <div class="dashboard">
            {% for target in targets %}
            <div class="card">
                <div class="header">
                    <div>
                        <div style="font-weight: 600; font-size: 1.125rem;">{{ target.name }}</div>
                        <div class="url">{{ target.url }}</div>
                    </div>
                    <span class="status {{ target.status }}">{{ target.status }}</span>
                </div>
                <div class="metrics">
                    <div class="metric">
                        <span class="label">Latency</span>
                        <span class="value">{{ target.latency }}</span>
                    </div>
                    <div class="metric">
                        <span class="label">Interval</span>
                        <span class="value">{{ target.interval }}s</span>
                    </div>
                    <div class="metric">
                        <span class="label">Last Check</span>
                        <span class="value">{{ target.last_checked }}</span>
                    </div>
                </div>
            </div>
            {% else %}
            <div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px;">
                No monitors configured yet. Use the API to add targets.
            </div>
            {% endfor %}
        </div>
    </div>
    
    <script>
        // Auto-refresh every 10s
        setTimeout(() => window.location.reload(), 10000);
    </script>
</body>
</html>
